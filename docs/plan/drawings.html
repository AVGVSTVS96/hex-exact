<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>hex Exact, finished: drawings</title>
<style>
:root{color-scheme:light dark;
--bg:light-dark(#FFFFFF,#000000);--glass:light-dark(#FFFFFF,#1C1C1E);--glassEdge:light-dark(#00000024,#FFFFFF1F);
--fill:light-dark(#7878801F,#7878803D);--fill2:light-dark(#F2F2F7,#1C1C1E);--sep:light-dark(#3C3C4336,#54545899);
--text:light-dark(#0A0A0A,#F5F5F5);--sec:light-dark(#6B6B70,#A1A1A8);--ter:light-dark(#A6A6AB,#636368);
--accent:light-dark(#1F8A6D,#C4F3E5);--accentW:light-dark(#D7F2EA,#1B3534);
--ask:light-dark(#A35F00,#F2C58A);--askW:light-dark(#F7E6CF,#3A2E1E);
--prog:light-dark(#0A66D2,#8DB8FF);--progW:light-dark(#CFE0F7,#1F3354);
--danger:light-dark(#D93A42,#F0A5A8);--end:#EB4B4B;
--prom:light-dark(#0A0A0A,#F5F5F5);--onprom:light-dark(#FFFFFF,#0A0A0A);
--shadow:light-dark(#0000001F,#00000000);--hinge:light-dark(#0000001A,#FFFFFF1C);--sel:light-dark(#F2F2F7,#1C1C1E);
--tg:#2AABEE}
*{box-sizing:border-box}
body{margin:0;background:light-dark(#EDEDF0,#111113);color:var(--text);font-family:"SF Pro Text","SF Pro",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
/* the window */
.dev{position:relative;background:var(--bg);color:var(--text);overflow:hidden;font-size:17px;line-height:22px}
.abs{position:absolute}
.pane{position:absolute;top:0;bottom:0;overflow:hidden}
/* furniture: the system's, drawn as the shots show it */
.cam{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#000;box-shadow:0 0 0 1px light-dark(#00000000,#2A2A2C)}
.clock{position:absolute;transform:translate(-50%,-50%);font-weight:600;font-size:16px;letter-spacing:-.1px;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.ring{position:absolute;width:46px;height:48px;margin:-23px 0 0 -23px;color:var(--text)}
.hingeV{position:absolute;top:0;bottom:0;width:1px;background:var(--hinge)}
.hingeH{position:absolute;left:0;right:0;height:1px;background:var(--hinge)}
/* chrome: glass beside the status icons */
.glass{background:var(--glass);border:.5px solid var(--glassEdge);box-shadow:0 1px 2px var(--shadow),0 6px 18px var(--shadow)}
.cap{position:absolute;height:44px;border-radius:22px;display:flex;align-items:center;padding:0 4px}
.cap .i,.circ{width:44px;height:44px;display:grid;place-items:center;position:relative;border-radius:22px;color:var(--text)}
.circ{position:absolute}
.cap .i.on{background:var(--fill)}
.cap svg,.circ svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cap .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ask);box-shadow:0 0 0 2px var(--glass)}
.upd{position:absolute;height:44px;border-radius:22px;display:flex;align-items:center;gap:8px;padding:0 4px 0 14px;font-size:15px;line-height:20px;white-space:nowrap}
.upd b{font-weight:500}
.upd .go{height:32px;border-radius:16px;padding:0 13px;display:grid;place-items:center;background:var(--prom);color:var(--onprom);font-weight:600;font-size:15px}
.upd .x{width:30px;height:32px;display:grid;place-items:center;color:var(--sec)}.upd .x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
/* hex */
.orb{position:relative;overflow:hidden;border-radius:50%;flex:none}
.orb::before{content:"";position:absolute;inset:-18%;background:conic-gradient(from 20deg,#ff6f61,#ffb25e,#f7f35c,#7fe08a,#3ccfd8,#5b8cff,#d77bff,#ff8ad0,#ff6f61);filter:blur(7px)}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ffffffcc 0,#fff0 34%),radial-gradient(circle at 30% 24%,#ffffffb0 0,#fff0 22%),radial-gradient(circle at 50% 50%,#0000 58%,light-dark(#6a6a7a40,#00000080) 100%)}
.who{display:flex;flex-direction:column;align-items:center;text-align:center}
.who .nm{font-size:17px;line-height:22px;font-weight:600;margin-top:8px}
.live{color:var(--sec);font-size:15px;line-height:20px;margin-top:3px;text-wrap:balance}
.live .dots{display:inline-flex;gap:3px;margin-right:7px;vertical-align:middle;position:relative;top:-1px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--prog);display:block}.dots i:nth-child(1){opacity:.4}.dots i:nth-child(2){opacity:.7}
/* lists */
.head{display:flex;align-items:center;gap:12px;font-size:17px;line-height:22px;font-weight:600;padding:20px 10px 4px}
.head .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}.head .d i{width:8px;height:8px;border-radius:50%;display:block}
.head.ask{color:var(--ask)}.head.ask .d{background:var(--askW)}.head.ask .d i{background:var(--ask)}
.head.prog{color:var(--prog)}.head.prog .d{background:var(--progW)}.head.prog .d i{background:var(--prog)}
.head.pick{color:var(--accent)}.head.pick .d{background:var(--accentW)}.head.pick .d i{background:var(--accent)}
.head.plain{color:var(--text)}
.head.done{color:var(--text)}.head.done .d{background:var(--fill)}.head.done .d i{background:var(--sec)}
.dlink{display:flex;gap:12px;align-items:center;padding:12px 10px;margin-top:8px;border-bottom:.5px solid var(--sep);font-weight:600}.dlink .c{margin-left:auto;color:var(--ter)}.dlink .c svg{width:8px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.head .n{margin-left:auto;color:var(--ter);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;padding:9px 10px;align-items:flex-start;border-radius:12px}
.row.sel{background:var(--sel)}
.row .b{flex:1;min-width:0}.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--sec);font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{color:var(--ter);font-size:12px;line-height:16px;padding-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .pill{align-self:center}
.m{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;margin-top:0}
.m svg{width:11px;height:11px}
.m.q{background:var(--ask);color:var(--bg);font-size:14px;font-weight:700;line-height:22px}
.m.dec{background:var(--accentW);color:var(--accent)}.m.dec svg{fill:currentColor}
.m.w svg{width:20px;height:20px}
.m.done{border-radius:6px;width:20px;height:20px;margin:1px;border:1.5px solid var(--ter);color:var(--sec)}.m.done svg{stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;width:10px;height:10px}
.more{display:flex;gap:12px;align-items:center;color:var(--sec);font-size:15px;line-height:20px;padding:6px 10px}
.more .g{width:22px;display:grid;place-items:center;flex:none}.more .g svg{width:14px;height:4px;fill:var(--ter)}
.decided{display:flex;gap:12px;align-items:center;padding:12px 10px 6px;margin-top:14px;border-top:.5px solid var(--sep);font-weight:600}
.decided .c{margin-left:auto;color:var(--ter)}.decided .c svg{width:8px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:13px;line-height:18px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--fill);color:var(--text);white-space:nowrap;flex:none}
.fade{position:absolute;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 55%)}
/* the call button */
.call{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--prom);color:var(--onprom);display:grid;place-items:center;box-shadow:0 6px 20px var(--shadow)}
.call svg{width:26px;height:26px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
/* pages */
.title{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.2px}
.ptitle{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.1px}
.psub{color:var(--sec);font-size:15px;line-height:20px;margin-top:2px}
.tabs{display:flex;gap:6px;font-size:15px;line-height:20px;white-space:nowrap}
.tabs span{padding:7px 12px;border-radius:999px;background:var(--fill);color:var(--text);font-weight:500}
.tabs .on{background:var(--prom);color:var(--onprom)}
.tabs em{font-style:normal;margin-left:5px;color:var(--sec);font-variant-numeric:tabular-nums}.tabs .on em{color:light-dark(#F2C58A,#A35F00)}
.meta{display:flex;align-items:center;gap:8px;color:var(--sec);font-size:13px;line-height:18px;font-variant-numeric:tabular-nums}
.meta .ad{width:8px;height:8px;border-radius:50%;background:var(--ask);flex:none}
.qt{font-size:20px;line-height:26px;font-weight:600;margin:10px 0 8px;letter-spacing:-.3px;text-wrap:pretty}
.qb{font-size:17px;line-height:24px;color:var(--text);margin:0;text-wrap:pretty}
.why{display:flex;gap:6px;align-items:center;font-size:15px;line-height:20px;color:var(--sec);margin:12px 0 0}
.why b{color:var(--text);font-weight:600}.why svg{width:8px;height:12px;stroke:var(--ter);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-left:2px}
.why.open svg{transform:rotate(90deg)}
.quote{margin:8px 0 0;padding:2px 0 2px 12px;border-left:2px solid var(--sep);color:var(--sec);font-size:15px;line-height:21px}
.quote .who2{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:600;font-size:13px;line-height:18px;margin-bottom:2px}
.tile{width:18px;height:18px;border-radius:5px;background:var(--tg);display:grid;place-items:center;flex:none}.tile svg{width:10px;height:10px;fill:#fff}
.ans{border-top:.5px solid var(--sep);margin-top:16px}
.a{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep)}
.a .r{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ter);flex:none}
.a.pick .r{border-color:var(--accent)}
.a .l{flex:1;min-width:0}.a .l .s{color:var(--sec);font-size:15px;line-height:20px}
.a .k{color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap;align-self:center}
.dock .plus{flex:none;width:38px;height:38px;border-radius:50%;background:var(--fill);color:var(--text);display:grid;place-items:center;margin-right:10px}
.dock .plus svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dock{position:absolute;height:48px;border-radius:24px;display:flex;align-items:center;padding:0 5px;color:var(--ter);font-size:17px;background:var(--fill2);border:.5px solid var(--glassEdge)}
.dock span{flex:1}.dock .mic{flex:none;width:38px;height:38px;border-radius:50%;background:var(--prom);color:var(--onprom);display:grid;place-items:center}
.dock .mic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.sec{font-size:13px;line-height:18px;font-weight:600;color:var(--sec);margin:18px 0 6px;letter-spacing:.1px}
.now{display:flex;gap:12px;align-items:flex-start}
.now .tx{flex:1;font-size:17px;line-height:23px;text-wrap:pretty}
.link{display:inline-flex;align-items:center;gap:5px;font-size:15px;line-height:20px;font-weight:600;color:var(--text);margin-top:8px}
.link svg{width:8px;height:12px;stroke:var(--ter);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.place{display:inline-flex;align-items:center;gap:7px;font-size:15px;line-height:20px;color:var(--text);font-weight:500;padding:6px 12px 6px 7px;border-radius:999px;background:var(--fill)}
.place .tile{width:22px;height:22px;border-radius:6px}.place .tile svg{width:12px;height:12px}
.lane{position:relative;height:28px;border-radius:8px;background:var(--fill);overflow:hidden}
.lane i{position:absolute;top:8px;bottom:8px;border-radius:4px;background:var(--prog)}
.days{display:flex;justify-content:space-between;color:var(--ter);font-size:12px;line-height:16px;margin-top:6px;padding:0 4px}
.drow{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.drow .b{flex:1;min-width:0;font-size:17px;line-height:22px}.drow .tm{color:var(--ter);font-size:12px;padding-top:3px;white-space:nowrap}
.drow .s{color:var(--sec);font-size:15px;line-height:20px}
/* call */
.words{display:flex;flex-direction:column;gap:14px}
.hw{font-size:21px;line-height:28px;font-weight:500;letter-spacing:-.3px;color:var(--text);text-wrap:pretty}
.hw.old{color:var(--sec)}
.mine{align-self:flex-end;max-width:82%;background:var(--fill2);border-radius:20px;padding:9px 14px;font-size:17px;line-height:23px;color:var(--text)}
.mine.old{color:var(--sec)}
.agent{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px;line-height:20px;color:var(--prog);white-space:nowrap}
.agent svg{width:16px;height:16px;flex:none}
.ctl{position:absolute;display:flex;gap:28px;align-items:center}
.ctl .c{width:58px;height:58px;margin:5px 0;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.ctl .c.end{margin:0}
.ctl .c.glass{background:light-dark(#F2F2F7,var(--glass))}
.ctl .c svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctl .end{width:68px;height:68px;background:var(--end);color:#fff;border:0;box-shadow:0 6px 20px #eb4b4b40}
.ctl .end svg{width:30px;height:30px;stroke-width:2.2}
.ctl .lab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:90px;gap:6px;font-size:12px;line-height:16px;color:var(--sec)}
.timer{color:var(--sec);font-size:15px;line-height:20px;font-variant-numeric:tabular-nums;margin-top:2px}
/* a topic's thread */
.th{display:flex;flex-direction:column;gap:12px}
.th .hx{font-size:17px;line-height:24px;max-width:88%;text-wrap:pretty}
.th .stamp{align-self:center;color:var(--ter);font-size:12px;line-height:16px;font-variant-numeric:tabular-nums}
.photo{align-self:flex-end;width:210px;height:150px;border-radius:18px;position:relative;overflow:hidden;
 background:radial-gradient(120% 70% at 20% 10%,#ffffff60,#fff0 60%),linear-gradient(115deg,#0000 38%,#8a8f9840 40%,#0000 43%,#0000 62%,#7d838c30 64%,#0000 66%),linear-gradient(160deg,#e9e7e2,#cfcac2 55%,#b9b2a7)}
.photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(90deg,#8a5a34,#a8703f 30%,#94603a 60%,#b07a48);box-shadow:inset 0 2px 0 #00000030}
.mine.failed{opacity:.6}
.fail{align-self:flex-end;display:flex;align-items:center;gap:8px;margin-top:-6px;font-size:13px;line-height:18px;color:var(--danger)}
.fail .bang{width:16px;height:16px;border-radius:50%;background:var(--danger);color:var(--bg);display:grid;place-items:center;flex:none}.fail .bang svg{width:10px;height:10px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:currentColor}
.fail .pill{padding:4px 11px}
/* steps */
.plan{display:flex;gap:12px;align-items:flex-start;padding:12px 0 4px}
.plan .t{font-size:17px;line-height:22px;font-weight:600}.plan .t.todo{color:var(--sec)}
.plan .o{width:20px;height:20px;margin:1px;border-radius:6px;border:1.5px dashed var(--ter);flex:none}
.ag{display:flex;align-items:center;gap:9px;margin-left:34px;padding:6px 0 4px;font-size:15px;line-height:20px}
.ag .av{width:24px;height:24px;border-radius:7px;background:var(--fill);color:var(--text);display:grid;place-items:center;flex:none}
.ag .av svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round}
.ag b{font-weight:600}.ag .st{margin-left:auto;color:var(--sec);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}.ag .st.go{color:var(--prog)}
.steps{margin-left:45px;padding-left:16px;border-left:1.5px solid var(--sep)}
.st1{position:relative;display:flex;gap:6px;align-items:baseline;font-size:14px;line-height:19px;color:var(--sec);padding:4px 0}
.st1::before{content:"";position:absolute;left:-20.5px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--ter);box-shadow:0 0 0 2px var(--bg)}
.st1 .tx{flex:1}.st1 .sp{width:7px;flex:none}.st1 .tm{color:var(--ter);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st1 svg{width:7px;height:11px;stroke:var(--sec);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;align-self:center}
.st1.open{color:var(--text);font-weight:500}.st1.open svg{transform:rotate(90deg);stroke:var(--text)}
.res{margin:2px 0 8px;padding:10px 12px;border-radius:12px;background:var(--fill2);font-size:14px;line-height:20px;color:var(--text)}
.res p{margin:0 0 6px}.res p:last-child{margin:0}.res b{font-weight:600}
/* what hex decided */
.dc{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.dc .b{flex:1;min-width:0}.dc .t{font-weight:600}.dc .s{color:var(--sec);font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .cv{width:8px;height:13px;flex:none;color:var(--ter)}.dc .cv svg{width:8px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dc.open{border:0}.dc.open .cv svg{transform:rotate(90deg)}
.story{margin:0 0 4px 34px;padding:0 0 12px;border-bottom:.5px solid var(--sep);font-size:15px;line-height:21px}
.story .lb{font-size:12px;line-height:16px;font-weight:600;color:var(--ter);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 3px}
.story .pk{color:var(--accent);font-weight:600}
.story .gv{display:flex;gap:8px;color:var(--sec);margin-top:3px}.story .gv b{color:var(--text);font-weight:500;white-space:nowrap}
/* calls */
.day{font-size:13px;line-height:18px;font-weight:600;color:var(--sec);margin:18px 0 2px}
.cl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.cl:last-child{border:0}
.cl .w{width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--text);display:grid;place-items:center;flex:none}.cl .w svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.cl .b{flex:1;min-width:0}.cl .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl .s{color:var(--sec);font-size:13px;line-height:18px;font-variant-numeric:tabular-nums}
.cl .len{color:var(--sec);font-size:15px;font-variant-numeric:tabular-nums}
/* settings */
.flat .set{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.flat .set:last-child{border:0}
.set .ic{width:22px;flex:none;color:var(--sec);display:grid;place-items:center}.set .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.set .b{flex:1;min-width:0}.set .t{font-size:17px;line-height:22px}.set .s{font-size:13px;line-height:18px;color:var(--sec)}
.set .pl{width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--text);display:grid;place-items:center;flex:none}.set .pl svg{width:11px;height:11px;fill:currentColor;margin-left:2px}
.set .cv{color:var(--ter)}.set .cv svg{width:8px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}.seg b{font-weight:500;font-size:13px;line-height:18px;padding:5px 9px;border-radius:7px}.seg b.on{background:light-dark(#fff,#636366)}
.tog{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003}
.tog.on{background:#34C759}.tog.on::after{left:22px}
.pdots{display:flex;gap:6px;margin-top:8px}.pdots i{width:6px;height:6px;border-radius:50%;background:var(--ter)}.pdots i.on{background:var(--text)}
.sw{display:flex;justify-content:center;gap:4px;margin:10px 0 6px}.sw span{width:36px;height:36px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}.sw span.on{border-color:var(--text)}.sw i{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 .5px var(--sep)}
.orb.dusk::before{background:conic-gradient(from 20deg,#7b5cff,#c07bff,#9B4DD6,#e08aff,#7b5cff,#4b6bff,#7b5cff)}
.cdock{position:absolute;left:16px;right:16px;bottom:18px;height:66px;border-radius:33px;display:flex;align-items:center;gap:10px;padding:0 9px 0 14px}
.cdock .back2{flex:1;display:flex;gap:12px;align-items:center;min-width:0}
.cdock .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--text);flex:none}
.cdock .c svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cdock .c.end{background:var(--end);color:#fff}.cdock .c.end svg{width:26px;height:26px}
/* the index */
main{max-width:1600px;margin:auto;padding:28px 20px 80px}
main h1{font-size:26px;margin:0 0 6px;font-weight:700}main h2{font-size:19px;margin:44px 0 4px;font-weight:600}
main .lede{color:var(--sec);margin:0 0 14px;max-width:780px;font-size:15px;line-height:21px}
.grid{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
figure{margin:0}figcaption{font-size:13px;color:var(--sec);padding:7px 2px 0}figcaption b{color:var(--text);font-weight:600}
.frame{overflow:hidden;border-radius:16px;border:.5px solid var(--glassEdge)}
.frame>.dev{transform-origin:0 0}
body.only{background:var(--bg)}
</style></head><body><main id="m"></main>
<script>
// Every name, topic and number below is made up.
const I={
 calls:'<svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3.5 4.5V9H8M12 7.5V12l3 2"/></svg>',

 settings:'<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>',

 spark:'<svg viewBox="0 0 12 12"><path d="M6 .5c.4 2.9 1.6 4.1 4.5 4.5v.1C7.6 5.5 6.4 6.7 6 9.6h-.1C5.5 6.7 4.3 5.5 1.4 5.1V5C4.3 4.6 5.5 3.4 5.9.5z" transform="translate(0 .9)"/></svg>',

 micOff:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>',
 cam:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="13" height="11" rx="3"/><path d="M15.5 10.5l5-3v9l-5-3"/></svg>',
 end:'<svg viewBox="0 0 24 24"><path d="M3.2 13.6c-.6-.6-.6-1.6.1-2.2 4.8-4 12.6-4 17.4 0 .7.6.7 1.6.1 2.2l-1.3 1.3c-.5.5-1.3.6-1.9.2l-2-1.3c-.5-.3-.7-.8-.6-1.4l.2-1.2c-2-.7-4.4-.7-6.4 0l.2 1.2c.1.6-.1 1.1-.6 1.4l-2 1.3c-.6.4-1.4.3-1.9-.2z" style="fill:currentColor;stroke:none"/></svg>',
 x:'<svg viewBox="0 0 13 13"><path d="M2 2l9 9M11 2l-9 9"/></svg>',
 speaker:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
 tap:'<svg viewBox="0 0 24 24"><path d="M9.5 11V5.5a1.5 1.5 0 0 1 3 0V12l3.6.7c1 .2 1.7 1.2 1.5 2.2l-.8 4.6H11l-3.6-4.3c-.5-.6-.4-1.5.2-2 .6-.4 1.4-.3 1.9.2z"/><path d="M6.5 6.5a4.5 4.5 0 0 1 9 0"/></svg>',
 stop:'<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" style="fill:currentColor;stroke:none"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5" style="stroke-width:2.3"/></svg>',
 play:'<svg viewBox="0 0 12 12"><path d="M3.5 2.2v7.6L9.8 6z"/></svg>',
 agent:'<svg viewBox="0 0 16 16"><rect x="2.5" y="4" width="11" height="9" rx="3"/><path d="M8 4V2"/><circle cx="6" cy="8.5" r=".9" style="fill:currentColor;stroke:none"/><circle cx="10" cy="8.5" r=".9" style="fill:currentColor;stroke:none"/></svg>',
 bang:'<svg viewBox="0 0 12 12"><path d="M6 2.8v4"/><circle cx="6" cy="9.2" r=".4"/></svg>',

};
const spin=(s=20)=>`<svg viewBox="0 0 20 20" width="${s}" height="${s}"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--progW)" stroke-width="2.25"/><circle cx="10" cy="10" r="8" fill="none" stroke="var(--prog)" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="14 40" transform="rotate(-30 10 10)"/></svg>`;

// beside the status icons.
const POSE={
 'cover-up':{w:466,h:678,cam:[418,47],clock:[418,93],ring:[418,128],bar:{y:47,end:384},clear:156},
 'cover-side':{w:678,h:466,cam:[47,48],clock:[578,44],ring:[631,44],bar:{y:44,end:542},clear:76},
 'open-up':{w:951,h:669,clock:[903,39],ring:[903,75],hinge:'v',bar:{y:39,end:866},clear:0},
 'open-side':{w:669,h:951,clock:[569,48],ring:[622,47],hinge:'h',bar:{y:48,end:533},clear:80},

const furniture=p=>{const P=POSE[p];return (P.hinge=='v'?`<div class="hingeV" style="left:${P.w/2-.5}px"></div>`:P.hinge=='h'?`<div class="hingeH" style="top:${P.h/2-.5}px"></div>`:'')
 +(P.cam?`<div class="cam" style="left:${P.cam[0]}px;top:${P.cam[1]}px"></div>`:'')
 +`<div class="clock" style="left:${P.clock[0]}px;top:${P.clock[1]}px">9:41</div><div class="ring" style="left:${P.ring[0]}px;top:${P.ring[1]}px">${ringSvg}</div>`};

// The toolbar: Calls, Tasks and Settings in one capsule, Back beside the status icons on inner pages,
// the update notice in the row's free space.
// The capsule never moves; Back takes the place to its left.
const toolbar=(p,{back=false,on='',update=false}={})=>{const P=POSE[p],top=P.bar.y-22,capL=P.bar.end-140;let h='';
 if(back)h+=`<div class="circ glass" style="left:${capL-54}px;top:${top}px" aria-label="Back">${I.back}</div>`;
 h+=`<div class="cap glass" style="left:${capL}px;top:${top}px"><div class="i${on=='calls'?' on':''}">${I.calls}</div><div class="i${on=='tasks'?' on':''}">${I.tasks}${on=='tasks'?'':'<span class="dot"></span>'}</div><div class="i${on=='settings'?' on':''}">${I.settings}</div></div>`;
 if(update)h+=`<div class="upd glass" style="left:16px;top:${top}px"><b>Update ready</b><span class="go">Install</span><span class="x">${I.x}</span></div>`;
 return h};

// hex: face, name, one live line (two lines allowed).
const hexHead=(size=60,max=300)=>`<div class="who"><div class="orb" style="width:${size}px;height:${size}px"></div><div class="nm">hex</div>
 <div class="live" style="max-width:${max}px">${LIVE}</div></div>`;
const LIVE=`<span class="dots"><i></i><i></i><i></i></span><span style="white-space:nowrap">Pricing countertops;</span> <span style="white-space:nowrap">the stone sample comes Friday</span>`;

// Home never scrolls: it shows as many of what needs you as fit, the rest behind Show N more.
const NEEDS=[['kitchen','Kitchen remodel','Quartz or wood for the island?','3:40 PM'],['lisbon-q','Lisbon trip','9:15 or 11:40 train to Sintra?','1:12 PM'],

const needsRows=(sel,n=3)=>NEEDS.slice(0,n).map(([k,t,s,tm])=>R(MQ,t,s,tm,sel==k)).join('');
const workRows=sel=>R(MW,'Lisbon trip','Checking hotels near Alfama','3:28 PM',sel=='lisbon');
const homeList=(sel,n=3)=>`<div class="head ask"><span class="d"><i></i></span>Needs you</div>${needsRows(sel,n)}${n<NEEDS.length?more(NEEDS.length-n):''}
 <div class="head prog"><span class="d"><i></i></span>Working on</div>${workRows(sel)}
 <div class="decided">${MD}<span>hex decided 12 this week</span><span class="c">${I.chev}</span></div>`;
// In a column beside a page, hex's head is a row: face, then name and live line.
const hexRow=(call=false)=>`<div style="display:flex;gap:14px;align-items:center"><div class="orb" style="width:52px;height:52px"></div><div style="flex:1;min-width:0"><div style="font-weight:600">hex</div><div class="live" style="margin-top:1px;text-align:left">${LIVE}</div></div>${call?`<div class="call" style="position:relative;width:52px;height:52px;flex:none">${I.wave}</div>`:''}</div>`;

// A task's page.
const taskPage=t=>{const T={
 lisbon:{title:'Lisbon trip',sub:'Working · started 2 h ago',now:'Checking hotels near Alfama under €180 a night, with a lift and a quiet street',
  need:['9:15 or 11:40 train to Sintra?','1:12 PM'],
  done:[['Booked both flights, aisle seats','11:02 AM'],['Found a 3‑day transit pass for €22','Nov 13']],
  dec:['Earlier flight home, no layover'],spans:[[.05,.12],[.34,.4],[.62,.7],[.86,1]]},
 kitchen:{title:'Kitchen remodel',sub:'Working · started 40 min ago',now:'Pricing countertops; the stone sample comes Friday',
  need:['Quartz or wood for the island?','3:40 PM'],
  done:[['Booked the installer for the 22nd','Nov 14'],['Ordered cabinet handles in brass','Nov 11']],
  dec:['Asked for the sink cutout in every quote'],spans:[[.1,.16],[.48,.58],[.9,1]]}}[t];
 return `<div class="ptitle">${T.title}</div><div class="psub">${T.sub}</div>
 <div style="margin-top:12px"><span class="place"><span class="tile">${I.plane}</span>Telegram</span></div>
 <div class="sec" style="color:var(--prog)">Now</div>
 <div class="now">${MW}<div><div class="tx">${T.now}</div><span class="link">Steps${I.chev}</span></div></div>

 <div class="hw">Done. I’ve asked them about the cutout, and I’ll tell you as soon as they answer.</div></div>`;

 <div class="photo" role="img" aria-label="Photo: a quartz sample on a wooden counter"></div>

 <div class="plan">${MDone}<div class="t">Get three countertop quotes</div></div>
 <div class="ag"><span class="av">${I.agent}</span><span><b>Quote finder</b> · agent</span><span class="st">done in 12 min</span></div>
 <div class="steps">

  <div class="st1"><i class="sp"></i><span class="tx">Emailed four suppliers</span><span class="tm">3:04</span></div>
  <div class="st1 open">${I.chev}<span class="tx">Read the three replies</span><span class="tm">3:14</span></div>
  <div class="res"><p><b>Stonecraft</b>: quartz €2,140, template visit included, install from the 22nd.</p><p><b>Mill &amp; Oak</b>: butcher block €980, ready in two weeks.</p><p><b>Granite Bros</b>: quartz €2,390, no template visit before Dec 2.</p></div>
 </div>
 <div class="plan">${MW}<div class="t">Ask about the sink cutout</div></div>
 <div class="ag"><span class="av">${I.agent}</span><span><b>Installer chat</b> · agent</span><span class="st go">working</span></div>
 <div class="steps">
  <div class="st1">${I.chev}<span class="tx">Wrote to Stonecraft on Telegram</span><span class="tm">3:41</span></div>
  <div class="st1"><i class="sp"></i><span class="tx">Waiting for their answer</span><span class="tm">now</span></div>
 </div>
 <div class="plan"><span class="o"></span><div class="t todo">Book the template visit</div></div>`;
// What hex decided, each with Undo; one opened to its full story.
const DEC=[['Newsletter','Kept plain text for issue 14'],['Kitchen remodel','Asked for the sink cutout in every quote'],['Bike repair','Took the Saturday slot at the shop']];
const decided=`
 <div class="dc open">${MD}<div class="b"><div class="t">Lisbon trip</div><div class="s">Earlier flight home, no layover</div></div><span class="pill">Undo</span><span class="cv">${I.chev}</span></div>
 <div class="story">
  <div class="lb">hex picked</div><div class="pk">Sunday 7:05 AM, direct · €148</div>
  <div class="lb">Why</div><div>You said you want to be home by noon on Sunday. It’s the only direct flight that lands before then.</div>
  <div class="lb">What the others gave up</div>
  <div class="gv"><b>10:30 via Madrid</b><span>€36 cheaper, but home at 4 PM</span></div>
