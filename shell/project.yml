name: HexExact
options:
  bundleIdPrefix: com.shahidy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Exact:
    path: ${EXACT_PACKAGE}
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "137.0.0"
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    from: "6.30.0"
targets:
  HexExact:
    type: application
    platform: iOS
    sources:
      - Shell
      - Shared
      - Siri/AskHex.swift
      - Siri/AskAttributes.swift
      - path: Siri/Skills.skillsbundle
        type: folder
        buildPhase: resources
    dependencies:
      - package: Exact
        product: ExactKit
      - package: Exact
        product: ExactUpdates
      - package: WebRTC
        product: WebRTC
      - package: RiveRuntime
        product: RiveRuntime
      - target: ExactModules
        link: false
        embed: true
      - target: Activity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.hexexact
        PRODUCT_NAME: HexExact
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-L$(EXACT_LIB_DIR)", "-l$(EXACT_LIB)"]
    info:
      path: Shell/Info.plist
      properties:
        CFBundleDisplayName: hex Exact
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HexURL: $(HEX_URL)
        HexToken: $(HEX_TOKEN)
        NSMicrophoneUsageDescription: hex listens through your microphone while you talk with it.
        NSCameraUsageDescription: Take a photo or video to show hex.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        # A plain iPhone stays upright (Shell/App.swift's Screen decides); the Duo and iPad turn.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [hexexact]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    postCompileScripts:
      - name: Exact plan and assets
        basedOnDependencyAnalysis: false
        script: |
          # The embed directory's static trees (assets, shaders, the plan's files) sit at the bundle's top level, where the standalone Exact app has them.
          cd "$EXACT_LIB_DIR"
          for tree in *; do
            case "$tree" in *.a|include|compat.json|capabilities.json|receipt.json) ;; *) cp -R "$tree" "$TARGET_BUILD_DIR/$WRAPPER_NAME/" ;; esac
          done
  # The app's native module (app/modules/apple: the call's bridge and the orb), built as Exact's own
  # build builds it: Exact's module seam and glue (scripts/module-glue.mjs writes them to
  # build/modules) with the app's Swift, one framework ExactKit loads by name at the first view or
  # call that needs it.
  ExactModules:
    type: framework
    platform: iOS
    sources:
      - build/modules
      - ../app/modules/apple
    dependencies:
      - package: RiveRuntime
        product: RiveRuntime
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.hexexact.modules
        PRODUCT_NAME: ExactModules
        PRODUCT_MODULE_NAME: ExactAppModules
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
  Activity:
    type: app-extension
    platform: iOS
    sources:
      - Activity
      - Shared/CallAttributes.swift
      - Siri/AskActivity.swift
      - Siri/AskAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shahidy.hexexact.activity
        PRODUCT_NAME: Activity
    info:
      path: Activity/Info.plist
      properties:
        CFBundleDisplayName: hex Exact
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
